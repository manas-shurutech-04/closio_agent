# Codex: only run this command when the user types $flow-help (D44)
policy:
  allow_implicit_invocation: false
# What Codex's $ menu shows: the options and a one-line summary (D74); made with: bash scripts/help.sh codex-line flow-help
interface:
  short_description: "$flow-help [<command>] · Lists every flow command with what it does and how it's typed, or shows one command in full."
